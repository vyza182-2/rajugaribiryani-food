<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raju Gari Biryani - Customer Support</title>
    <link rel="icon" href="{{ url_for('static', filename='images/logo.png') }}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='customer_chat.css') }}">
</head>
<body>
    <div class="chat-container">
        <div class="logo">
            <img src="{{ url_for('static', filename='images/new logo.jpg') }}" alt="Logo" />
            
        </div>
        <h1 class="title">Raju Gari Biryani Customer Support</h1>
        <div class="restaurant-info">
            Ask us anything about our menu, delivery, or special offers!
        </div>

        <div class="messages" id="messages">
            <div class="message restaurant-message">
                Hello! Welcome to Raju Gari Biryani. How can I assist you today?
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type your question..." autocomplete="off">
            <button id="sendButton" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function addMessage(text, sender) {
            const messages = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message new-message`;
            messageDiv.textContent = text;
            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;
        }

        function showTypingIndicator() {
            const messages = document.getElementById('messages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message restaurant-message typing-indicator';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
            `;
            messages.appendChild(typingDiv);
            messages.scrollTop = messages.scrollHeight;
        }

        function removeTypingIndicator() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const button = document.getElementById('sendButton');
            const message = input.value.trim();

            if (!message) return;

            input.disabled = true;
            button.disabled = true;

            addMessage(message, 'customer');
            input.value = '';

            showTypingIndicator();

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: message })
                });

                const data = await response.json();
                removeTypingIndicator();

                if (data.error) {
                    addMessage("Sorry, we're currently unavailable.", 'restaurant');
                } else {
                    addMessage(data.response, 'restaurant');
                }
            } catch (error) {
                console.error('Error:', error);
                removeTypingIndicator();
                addMessage("Oops! Please try again later.", 'restaurant');
            } finally {
                input.disabled = false;
                button.disabled = false;
                input.focus();
            }
        }

        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        window.onload = () => {
            document.getElementById('userInput').focus();
        };
    </script>
</body>
</html>
