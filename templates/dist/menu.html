{% extends "base.html" %}

{% block title %}Menu - {{ super() }}{% endblock %}

{% block content %}
<div class="menu-page">
    <div class="container my-5">
        <h1 class="text-center mb-4">Our Menu</h1>
        <p class="text-center mb-5">Select items and place your order below</p>
        <link rel="stylesheet" href="{{ url_for('static', filename='menu.css') }}">
        <!-- Menu Form -->
        <form action="/order" method="post" class="menu-form">
            <div class="form-section customer-info mb-4">
                <h2 class="section-title">Your Information</h2>
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="Enter your phone number" required>
                </div>
            </div>

            <div class="form-section menu-items mb-4">
                <h2 class="section-title">Our Delicious Menu</h2>
                <div class="menu-grid row">
                    {% for item, price in menu.items() %}
                        <div class="menu-card col-md-4 mb-3">
                            <div class="card border-primary">
                                <div class="card-body">
                                    <h3 class="item-name card-title">{{ item }}</h3>
                                    <p class="item-price card-text">₹{{ price }}</p>
                                    <div class="item-quantity d-flex justify-content-between align-items-center">
                                        <button type="button" class="quantity-btn btn btn-outline-secondary" data-item="{{ item }}">-</button>
                                        <input type="number" name="{{ item }}" min="0" value="0" class="quantity-input form-control text-center" id="{{ item }}-qty" style="width: 60px;">
                                        <button type="button" class="quantity-btn btn btn-outline-secondary" data-item="{{ item }}">+</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    {% endfor %}
                </div>
            </div>

            <div class="form-actions text-center">
                <button type="submit" class="btn btn-primary order-btn">Place Order</button>
            </div>
        </form>
    </div>
</div>

<!-- Quantity Button Logic -->
<script>
    document.querySelectorAll('.quantity-btn').forEach(button => {
        button.addEventListener('click', () => {
            const item = button.dataset.item;
            const input = document.getElementById(item + '-qty');
            let value = parseInt(input.value) || 0;

            if (button.classList.contains('plus')) {
                input.value = value + 1;
            } else if (button.classList.contains('minus') && value > 0) {
                input.value = value - 1;
            }
        });
    });
</script>
{% endblock %}
